<style>
/* 차량 센터 디스플레이 형식 (Tesla Model 3/Y 라이트 모드 계열, 2026-09-26).
   값은 Tesla 화면 캡처에서 잰 것 — 평면(그림자 없음) 카드, 회색 단계,
   강조 파랑 하나, 검정 도크. 그림자는 3D 기체 밑에만 있다. */
@font-face { font-family: "Inter"; src: url(/vendor/inter/inter-latin-wght-normal.woff2) format("woff2"); font-weight: 100 900; font-display: swap; }
:root {
  --bg: #f4f4f6; --stage: #eeeef1; --card: #ededef; --line: #e1e1e3; --track: #c6c6c8;
  --ink: #171a20; --ink2: #383838; --dim: #828284; --muted: #a8a8ab;
  --acc: #3e6ae1; --ok: #1f9d55; --warn: #d99a06; --bad: #dc2626;
  --font: "Inter", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", -apple-system, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); overflow: hidden; font: 14px/1.4 var(--font); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; }
svg.i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.num { font-variant-numeric: tabular-nums; }

.scr { height: 100vh; height: 100dvh; display: grid; grid-template-columns: minmax(238px, 21%) 1fr; grid-template-rows: 1fr; }

/* ── 좌: 기체 상태 패널 ── */
.pane { background: var(--bg); border-right: 1px solid var(--line); padding: 18px 22px 16px; display: flex; flex-direction: column; gap: 14px; min-height: 0; overflow-y: auto; scrollbar-width: none; }
.pane::-webkit-scrollbar { display: none; }
.ident { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
.ident b { font-size: 20px; font-weight: 700; letter-spacing: .02em; }
.ident span { font-size: 13px; font-weight: 600; letter-spacing: .06em; color: var(--dim); font-variant-numeric: tabular-nums; }
.gear { display: flex; align-items: center; gap: 14px; font-size: 13px; letter-spacing: .14em; color: var(--muted); font-weight: 500; }
.gear .grow { flex: 1; }
.gear .bat { display: flex; align-items: center; gap: 6px; letter-spacing: 0; color: var(--ink2); font-size: 15px; font-weight: 500; }
.gear .bat svg { width: 30px; height: 16px; }
.gear .bat.warn { color: var(--warn); } .gear .bat.bad { color: var(--bad); }
.spd { display: flex; align-items: flex-end; gap: 18px; }
.spd .v { font-size: 96px; font-weight: 300; line-height: .9; letter-spacing: -.04em; }
.spd .v.off { color: var(--track); }
.spd .spdv { display: flex; align-items: flex-end; gap: 6px; }   /* 단위는 숫자 오른쪽 아래 — 세로 칸을 속도가 다 쓴다 */
.spd .u { font-size: 13px; font-weight: 700; letter-spacing: .02em; color: var(--ink2); margin-bottom: 4px; }
.spd .arm { flex: 1 1 0; min-width: 0; margin-bottom: 4px; text-align: right; }
.spd .arm b { display: block; font-size: 13px; font-weight: 700; letter-spacing: .1em; color: var(--muted); }
.spd .arm b.on { color: var(--ok); } .spd .arm b.air { color: var(--acc); }
.spd .arm span.blue { color: var(--acc); } .spd .arm span.warn { color: var(--warn); } .spd .arm span.bad { color: var(--bad); }
.spd .arm span { display: block; font-size: 34px; line-height: 1.1; color: var(--ink2); font-weight: 600; white-space: nowrap; overflow: hidden; }   /* 모드 — 길면 fitMode 가 줄인다 */

.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
.gear .bat small { font-size: .72em; color: var(--dim); margin-left: 1px; font-weight: 500; }


/* 자세계 */
.hud { flex: none; aspect-ratio: 300 / 116; max-height: 150px; position: relative; }
.hud .att { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#hudHz, #hudRoll { transform-origin: 0 0; transition: transform .25s linear; }

/* 계기판 — 3칸. 모터 그림이 두 칸, 편차·평균이 셋째 칸 */
.strip { flex: 1 1 auto; margin-top: 10px; display: flex; flex-direction: column; justify-content: space-evenly; min-height: 0; }   /* 이름 왼쪽 · 값 오른쪽, 남은 높이에 고르게 */
.strip .sc { display: flex; justify-content: space-between; align-items: baseline; }
.strip .sc b { order: 2; display: block; font-size: clamp(26px, min(2.7vw, 4.6vh), 38px); font-weight: 300; white-space: nowrap; }   /* 좁은 패널에서 넘치지 않게 폭 따라 */
.strip .sc b small { font-size: .62em; color: var(--dim); margin-left: 1px; font-weight: 500; }
.strip .sc span { order: 1; font-size: 13px; letter-spacing: .08em; color: var(--muted); }
.fcwarn { color: var(--bad); font-size: 13px; font-weight: 600; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.strip .sc.warn b { color: var(--warn); } .strip .sc.bad b { color: var(--bad); }

/* ── 우: 무대 ── */
.main { position: relative; min-width: 0; min-height: 0; background: radial-gradient(ellipse 70% 60% at 50% 58%, #fbfbfc 0%, var(--stage) 70%, #e6e6ea 100%); overflow: hidden; }
.bar { position: absolute; top: 0; left: 0; right: 0; height: 52px; display: flex; align-items: center; gap: 18px; padding: 0 22px; z-index: 3; font-size: 14px; color: var(--ink2); font-weight: 500; }
.bar .grow { flex: 1; }
.bar .st { display: flex; align-items: center; gap: 6px; }
.bar .st svg.i { width: 18px; height: 18px; }
.bar .st.warn { color: var(--warn); } .bar .st.bad { color: var(--bad); }
.bar .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--track); }
.bar .dot.on { background: var(--ok); }
.tabs { position: absolute; top: 56px; left: 0; right: 0; display: flex; justify-content: center; gap: 4px; z-index: 3; pointer-events: none; }
.tabs button { pointer-events: auto; background: none; border: 0; font-size: 15px; font-weight: 500; color: var(--dim); padding: 7px 16px; border-radius: 8px; cursor: pointer; }
.tabs button.on { background: #fff; color: var(--ink2); font-weight: 600; }
#view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
#view.drag { cursor: grabbing; }

/* 부위 표시 — 가는 세로선 끝에 작은 대문자 이름과 회색 값 */
#calls { position: absolute; inset: 0; pointer-events: none; z-index: 2; }
.call { position: absolute; left: 0; top: 0; display: flex; flex-direction: column; align-items: center; transform: translate(-50%, -100%); transition: opacity .35s; }
.call .k { font-size: 11px; font-weight: 600; letter-spacing: .1em; color: var(--dim); }
.call .k:empty { display: none; }
.call .v { margin-top: 3px; background: var(--track); color: #262628; font-weight: 600; font-size: 15px; padding: 5px 10px; border-radius: 3px; white-space: nowrap; }
.call .v.warn { background: #f6d77a; } .call .v.bad { background: var(--bad); color: #fff; }
.call i { width: 1px; height: 44px; background: var(--dim); opacity: .7; }
.call.m i { display: none; }
.call i::after { content: ""; display: block; width: 5px; height: 5px; border-radius: 50%; background: var(--dim); margin: 42px 0 0 -2px; }

/* 홈 — 멀면 패드 위에, 화면 밖이면 그쪽 가장자리에 */
#htag { position: absolute; left: 0; top: 0; z-index: 2; pointer-events: none; display: flex; align-items: center; gap: 6px; transform: translate(-50%, -50%);
  background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 3px 10px 3px 3px; font-size: 13px; font-weight: 600; color: var(--ink2); white-space: nowrap; }
#htag[hidden] { display: none; }
#htag i { width: 20px; height: 20px; border-radius: 50%; background: var(--acc); color: #fff; font-style: normal; font-weight: 800; font-size: 12px; display: grid; place-items: center; }
#htag small { font-size: .78em; color: var(--dim); margin-left: 1px; font-weight: 500; }
body.intro #htag, .main.mapmode #htag { display: none; }
.tiles { position: absolute; left: 0; right: 0; bottom: 18px; display: flex; justify-content: center; gap: 8px; z-index: 3; pointer-events: none; padding: 0 16px; }
.tile { pointer-events: auto; width: 128px; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 12px 10px 10px; text-align: center; }
.tile b { display: block; font-size: 18px; font-weight: 600; white-space: nowrap; }
.tile b small { font-size: 12px; color: var(--dim); font-weight: 500; margin-left: 2px; }
.tile span { font-size: 12px; color: var(--dim); }
.tile.on { background: var(--acc); border-color: var(--acc); color: #fff; }
.tile.on svg.i, .tile.on span, .tile.on b small { color: #fff; }
.tile.warn b { color: var(--warn); } .tile.bad b { color: var(--bad); }
#loading { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 120px; height: 2px; background: var(--line); border-radius: 2px; overflow: hidden; z-index: 1; }
#loading i { display: block; height: 100%; width: 0; background: var(--acc); transition: width .2s; }

/* 로고 — 시작 페이지는 기체 아래 가운데(날아가면 사라진다), 대시보드는 도크 왼쪽 */
#brandIntro { position: absolute; left: 50%; bottom: 40px; width: 150px; height: 30px; transform: translateX(-50%); color: var(--muted); z-index: 2; pointer-events: none; opacity: 0; transition: opacity .4s; }
body.intro:not(.launch) #brandIntro { opacity: 1; }
/* 첫 화면 워드마크 — 왼쪽에서 번개처럼 긋고 들어와 멈춘 뒤, 빛줄기가 한 번 훑고 지나간다 */
body.intro:not(.launch) #brandIntro {
  animation: brandSwish .5s cubic-bezier(.15, .9, .2, 1) .35s both, brandGlint .9s ease-in-out .9s both;
  -webkit-mask-image: linear-gradient(105deg, #000 0 42%, rgba(0,0,0,.1) 50%, #000 58% 100%); mask-image: linear-gradient(105deg, #000 0 42%, rgba(0,0,0,.1) 50%, #000 58% 100%);
  -webkit-mask-size: 300% 100%; mask-size: 300% 100%;
}
@keyframes brandSwish {
  0% { opacity: 0; transform: translateX(calc(-50% - 160px)) skewX(-28deg); filter: blur(6px); }
  60% { opacity: 1; transform: translateX(calc(-50% + 8px)) skewX(-8deg); filter: blur(0); }
  100% { opacity: 1; transform: translateX(-50%) skewX(0); filter: blur(0); }
}
/* 기체를 눌러 넘어갈 때 — 화면 한가운데 큰 워드마크 */
#logoPlay { position: fixed; left: 50%; top: 50%; width: min(64vw, 620px); aspect-ratio: 1237 / 243; transform: translate(-50%, -50%);
  color: var(--ink2); z-index: 50; pointer-events: none; opacity: 0;
  -webkit-mask-image: linear-gradient(105deg, #000 0 42%, rgba(0,0,0,.08) 50%, #000 58% 100%); mask-image: linear-gradient(105deg, #000 0 42%, rgba(0,0,0,.08) 50%, #000 58% 100%);
  -webkit-mask-size: 300% 100%; mask-size: 300% 100%; }
body.launch #logoPlay { animation: lpIn .5s ease-out .35s both, brandGlint .45s ease-in-out .75s both, lpOut .5s ease-in 1.3s forwards; }   /* 가운데서 옅게 떠올라 진해지고, 빛이 훑은 뒤 제자리에서 흐려진다 */
@keyframes lpIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes lpOut { to { opacity: 0; transform: translate(-50%, -50%); filter: blur(10px); } }   /* 제자리에서 흐려지며 사라진다 */
@keyframes brandGlint { from { -webkit-mask-position: 100% 0; mask-position: 100% 0; } to { -webkit-mask-position: 0 0; mask-position: 0 0; } }

/* 기체 / 지도 전환 — 상태줄 왼쪽의 두 칸짜리 스위치 */
.seg { display: flex; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 2px; }
.seg button { border: 0; background: none; font-size: 13px; font-weight: 600; color: var(--dim); padding: 5px 14px; border-radius: 6px; cursor: pointer; }
.seg button.on { background: #fff; color: var(--ink2); }
#map { position: absolute; inset: 0; z-index: 1; display: none; background: #dcdde1; }
.main.mapmode #map { display: block; }
.main.mapmode #view, .main.mapmode .tabs, .main.mapmode #calls, .main.mapmode .tiles { display: none; }
.main.mapmode .bar { background: linear-gradient(rgba(244,244,246,.92), rgba(244,244,246,0)); }
#map .leaflet-tile-pane { filter: saturate(.75) brightness(1.04); }
/* 배송 — 3D 땅 위 지점 이름표 */
#dlvPts { position: absolute; inset: 0; z-index: 2; pointer-events: none; }
#dlvPts[hidden], body.intro #dlvPts { display: none; }
.dp small { margin-left: 6px; font-weight: 500; color: var(--dim); }
.dp.base small { color: #c9ccd3; }
.dp { position: absolute; left: 0; top: 0; pointer-events: auto; transform: translate(-50%, -50%); white-space: nowrap; background: #fff; color: var(--ink2); border: 1px solid var(--line); border-radius: 8px; padding: 5px 11px; font: 600 13px/1.2 inherit; box-shadow: 0 1px 4px rgba(0,0,0,.25); cursor: pointer; }
.dp.base { background: #171a20; color: #fff; border-color: #171a20; }
.dp.unv { border-style: dashed; color: var(--dim); }
.dp.base.unv { border-color: #fff; color: #fff; }
.dp.on { border-color: #3e6ae1; box-shadow: 0 0 0 2px #3e6ae1; }
#info .dlvin { width: 100%; font: inherit; font-size: 14px; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: #fff; margin: 8px 0 2px; box-sizing: border-box; }
#info .pfgo + .pfgo { margin-top: 6px; }
#info .dlverr { color: var(--bad); font-size: 13px; margin-top: 8px; }
.ac svg { transition: transform .4s; filter: drop-shadow(0 1px 2px rgba(0,0,0,.35)); }

/* 정보 카드 — 탭 요약·칸 부품·점검 */
/* 무대와 같은 그리드 칸에 겹쳐 둔다 (무대 안이 아니다 — 모바일에서 패널 뒤로 뺀다) */
.pane { grid-column: 1; grid-row: 1; } .main { grid-column: 2; grid-row: 1; }
#info { grid-column: 2; grid-row: 1; align-self: start; justify-self: start; position: relative; margin: 100px 0 0 18px; width: 300px; max-height: calc(100% - 230px); overflow-y: auto; z-index: 3;
  background: rgba(237,237,239,.94); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; scrollbar-width: thin; }
#info .ih { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
#info .ih b { font-size: 16px; font-weight: 700; flex: 1; }
#info .ih .at { font-size: 12px; color: var(--dim); font-variant-numeric: tabular-nums; }
#info .x { border: 0; background: none; font-size: 22px; line-height: 1; color: var(--dim); cursor: pointer; padding: 0 2px; }
#info .row { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; border-top: 1px solid var(--line); font-size: 13px; }
#info .row span { color: var(--dim); white-space: nowrap; }
#info .row b { font-weight: 600; text-align: right; }
#info .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.chip { border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 5px 12px; font-size: 13px; font-weight: 600; color: var(--ink2); cursor: pointer; }
.chip:hover { background: #fff; }
.verdict { font-size: 26px; font-weight: 800; letter-spacing: .02em; padding: 6px 0 10px; }
.verdict.ok { color: var(--ok); } .verdict.blk { color: var(--bad); }
.pferr { color: var(--bad); font-size: 13px; padding: 4px 0 10px; }
.pfl { list-style: none; margin: 0 0 10px; padding: 0; }
.pfl li { border-top: 1px solid var(--line); }
.pfl li button { width: 100%; display: flex; justify-content: space-between; gap: 10px; border: 0; padding: 7px 0; font-size: 13px; cursor: pointer;
  background: linear-gradient(90deg, rgba(62,106,225,.10) var(--pct), transparent var(--pct)); }
.pfl li.wait button { color: var(--muted); background: none; }
.pfl li b { font-weight: 700; }
.pfl li.ok b { color: var(--ok); } .pfl li.warn b { color: var(--warn); } .pfl li.blk b { color: var(--bad); } .pfl li.info b { color: var(--dim); }
.pfl li.ok button, .pfl li.warn button, .pfl li.blk button, .pfl li.info button { background: none; }
.pfb { padding: 2px 0 8px; }
.pfb .it { display: grid; grid-template-columns: 16px 1fr; gap: 0 6px; font-size: 12px; padding: 3px 0; }
.pfb .it i { font-style: normal; }
.pfb .it.ok i { color: var(--ok); } .pfb .it.warn i { color: var(--warn); } .pfb .it.blk i { color: var(--bad); }
.pfb .it em { grid-column: 2; font-style: normal; color: var(--dim); }
.pfgo { width: 100%; border: 1px solid var(--line); border-radius: 8px; background: #fff; color: var(--ink2); font-size: 14px; font-weight: 600; padding: 10px 0; cursor: pointer; }
.pfgo:hover { border-color: var(--track); }
.pfgo:disabled { color: var(--muted); cursor: default; }

/* 로그 재생 */
.pbbtn { display: flex; align-items: center; gap: 5px; border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 5px 12px; font-size: 13px; font-weight: 600; color: var(--ink2); cursor: pointer; }
.pbbtn svg { width: 12px; height: 12px; fill: currentColor; }
.ident .replay { display: none; margin-left: auto; font-style: normal; font-size: 12px; font-weight: 700; color: #fff; background: var(--acc); border-radius: 5px; padding: 2px 8px; white-space: nowrap; }
.ident .replay i { font-style: normal; font-weight: 500; }
body.replay .ident .replay { display: inline-block; }
#pbSheet { position: absolute; left: 18px; top: 100px; width: 420px; max-height: calc(100% - 130px); overflow-y: auto; z-index: 6; scrollbar-width: none;
  background: rgba(244,244,246,.97); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; box-shadow: 0 10px 30px rgba(23,26,32,.10); }
#pbSheet::-webkit-scrollbar { display: none; }   /* 스크롤은 되고 막대만 숨긴다 — 오른쪽 둥근 모서리를 덮지 않게 */
#pbSheet .ih { display: flex; align-items: center; margin-bottom: 6px; }
#pbSheet .ih b { flex: 1; font-size: 16px; }
#pbSheet .x { border: 0; background: none; font-size: 22px; color: var(--dim); cursor: pointer; }
.pbmsg { color: var(--dim); font-size: 13px; padding: 8px 0; }
.pbl button { width: 100%; display: grid; grid-template-columns: 116px 1fr 62px 46px; gap: 10px; align-items: center; border: 0; border-top: 1px solid var(--line); background: none; padding: 10px 2px; font-size: 13px; cursor: pointer; text-align: left; }
.pbl button:hover { background: #fff; }
.pbl .w { font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.pbl .b { font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 4px; background: var(--card); color: var(--dim); white-space: nowrap; }
.pbl .b.flight { background: #e3eafc; color: var(--acc); }
.pbl .b.misn, .pbl .b.rtl { background: #fbefd9; color: #8a5a00; }
.pbl .t { display: flex; flex-wrap: wrap; gap: 4px; }
.pbl .n { color: var(--dim); text-align: right; font-variant-numeric: tabular-nums; }
#pbBar { position: absolute; left: 18px; right: 18px; bottom: 16px; z-index: 5; height: 56px; display: flex; align-items: center; gap: 14px; padding: 0 14px 0 8px;
  background: #fff; border: 1px solid var(--line); border-radius: 12px; }
#pbBar[hidden] { display: none; }
#pbPlay { width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--ink); color: #fff; display: grid; place-items: center; cursor: pointer; flex: none; }
#pbPlay svg { width: 16px; height: 16px; fill: currentColor; }
#pbTime { font-size: 13px; font-weight: 600; color: var(--ink2); white-space: nowrap; }
#pbSeek { flex: 1; min-width: 80px; -webkit-appearance: none; appearance: none; height: 4px; border-radius: 2px; cursor: pointer;
  background: linear-gradient(90deg, var(--acc) var(--p, 0%), var(--track) var(--p, 0%)); }
#pbSeek::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; background: #fff; border: 2px solid var(--acc); }
#pbSeek::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: #fff; border: 2px solid var(--acc); }
#pbRate { border: 1px solid var(--line); background: var(--card); border-radius: 6px; padding: 4px 10px; font-weight: 700; font-size: 13px; cursor: pointer; }
#pbName { font-size: 13px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 220px; }
#pbX { border: 0; background: none; font-size: 22px; color: var(--dim); cursor: pointer; padding: 0 4px; }
.main.pbmode .tiles { bottom: 86px; }
.scr:has(.main.pbmode) #info { max-height: calc(100% - 300px); }
/* 재생 목록이 열리면 정보 카드는 치운다 — 같은 자리에 겹친다 */
.scr:has(#pbSheet:not([hidden])) #info { display: none; }

/* 첫 화면 — 기체만 크게. 기체를 누르면 앞으로 날아가며 대시보드가 열린다 */
body.intro .main { position: fixed; inset: 0; z-index: 10; padding-top: 0; }
body.intro #view { height: 100% !important; }
body.intro .bar, body.intro .tabs, body.intro .tiles, body.intro #calls, body.intro #info { visibility: hidden; }
body.opened .pane { animation: paneIn .7s cubic-bezier(.2,.8,.2,1) both; }
body.opened .bar, body.opened .tabs, body.opened .tiles { animation: fadeIn .6s .3s both; }
@keyframes paneIn { from { transform: translateX(-100%); opacity: 0; } }
@keyframes fadeIn { from { opacity: 0; } }

/* 암호 */
#modal { position: fixed; inset: 0; z-index: 20; background: rgba(23,26,32,.35); display: grid; place-items: center; }
#modal[hidden], #modal form[hidden] { display: none; }
:is(#pwForm, #dlvForm) { background: var(--bg); border-radius: 12px; padding: 20px; width: min(320px, calc(100% - 32px)); display: grid; gap: 10px; }
:is(#pwForm, #dlvForm) label { font-weight: 700; }
:is(#pwForm, #dlvForm) input { font: inherit; font-size: 18px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
#pwErr, #dlvErr { color: var(--bad); font-size: 13px; }
:is(#pwForm, #dlvForm) .r { display: flex; gap: 8px; justify-content: flex-end; }
:is(#pwForm, #dlvForm) .r button { border: 0; border-radius: 8px; padding: 9px 18px; font-weight: 600; cursor: pointer; background: var(--card); }
:is(#pwForm, #dlvForm) .r button.p { background: #fff; color: var(--ink2); border: 1px solid var(--line); }

/* 낮은 화면 — 좌측 패널이 스크롤 없이 들어오게 줄인다 */
@media (min-width: 901px) and (max-height: 820px) {
  .pane { gap: 10px; padding: 14px 18px 12px; }
  .spd .v { font-size: 72px; }
  .strip { gap: 8px; }
}
@media (min-width: 901px) and (max-height: 660px) {
  .hud { display: none; }
}

@media (max-width: 900px) {
  body { overflow: auto; }
  .scr { height: auto; min-height: 100dvh; grid-template-columns: 1fr; grid-template-rows: none; }
  .pane, .main, #info { grid-column: 1; grid-row: auto; }
  .main { order: 1; height: 58vh; }
  .pane { order: 2; border-right: 0; padding: 14px 16px; overflow: visible; }
    .strip { gap: 14px; } .strip .sc b { font-size: 38px; }   /* 폰 — 패널이 화면 폭이라 줄이지 않는다 */
  #info { order: 3; width: auto; max-height: none; margin: 0 10px 10px; justify-self: stretch; }
  body.intro .main { height: auto; }
  #pbSheet { left: 10px; right: 10px; top: 96px; width: auto; max-height: calc(100% - 106px); }
  #pbName { display: none; }
  .pbbtn { padding: 5px 9px; }
  #pbBar { left: 10px; right: 10px; gap: 8px; }
  .main .bar #clk { display: none; }
  .bar { padding: 0 16px; gap: 12px; font-size: 13px; }
  .tabs { top: 52px; }
  .tabs button { font-size: 14px; padding: 6px 8px; white-space: nowrap; }
  .tabs { overflow-x: auto; scrollbar-width: none; justify-content: safe center; padding: 0 8px; }   /* 탭이 많아 넘치면 글자를 세로로 접지 말고 옆으로 민다 */
  .tiles { justify-content: flex-start; overflow-x: auto; bottom: 12px; }
  .main.pbmode .tiles { bottom: 80px; }
  .tile { width: 104px; flex: none; }
  .spd .v { font-size: 72px; }
  .tabs button, .pbbtn, #pbRate { min-height: 40px; } .seg button { min-height: 36px; }
  #pbX, #info .x, #pbSheet .x { min-width: 40px; min-height: 40px; }
}
/* 가로로 눕힌 폰 — 무대를 화면 높이만큼, 타일은 아이콘을 빼 낮춘다 */
@media (max-width: 900px) and (max-height: 500px) {
  .main { height: calc(100dvh - 76px); }
  .tile { padding: 8px 8px 6px; }
}
</style>
