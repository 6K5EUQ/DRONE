<!doctype html>
<meta charset="utf-8">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<title>실시간 — DRONE01</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/app.css">
<link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="/live.css">

<main>
  <!-- 좌: HUD. DOM 순서상 먼저다 — 좁은 화면에서 그대로 위로 간다. -->
  <section id="hudPane">
    <!-- 🔴 지도와 HUD 는 **윗줄 안에서만** 1:3 이다.
         아래 계기판(고도·배터리·모터)은 이 분할과 무관하게 폭을 그대로 쓴다. -->
      <div id="hudBox">
      <!-- viewBox 는 layout() 이 실측 픽셀로 넣는다. 여기에 미리 쓰지 마라 —
           고정 viewBox 를 두면 배율이 1:1 이 아니게 되어 45° 뱅크가 30° 로 보인다. -->
      <svg id="hud" aria-label="HUD"></svg>
      <!-- 배터리 온도. HUD 좌측 하단에 겹쳐 둔다 — 계기판 칸을 하나 더 쓰기에는
           평소 볼 일이 없고, 뜨거워질 때만 눈에 들어오면 되는 값이다.
           BATTERY_STATUS.temperature 가 올 때만 값이 선다. ESC·모터 온도는 없다. -->
        <div id="hudTemp">0.0°C</div>
      </div>

    <!-- HUD 아래 계기판. 우측 2번째 차트 아랫선까지 올라온다.
         숫자만 보고 판단하는 자리라 크게 — 배치는 조종자가 부르는 순서다.
           고도  배터리  위성
           속도  전류    위치 오차
           기체 형상(모터 4개)  |  모터 편차
                                |  모터 평균
         모터는 **기체 그림 위에** 놓는다. 기수가 위인 X 형상이라 화면
         왼쪽 위 로터가 실제 좌전 모터다 — 어느 팔이 무리하는지 눈이
         바로 짚는다. 오른쪽 두 칸이 그 그림을 숫자로 요약한다. -->
    <div id="strip">
      <div class="sc" id="sc-alt"><span class="k">고도 <em>(m)</em></span><b id="st-alt">—</b></div>
      <div class="sc" id="sc-batt"><span class="k">배터리 <em>(%)</em></span><b id="st-batt">—</b></div>
      <div class="sc" id="sc-sats"><span class="k">위성 <em>(기)</em></span><b id="st-sats">—</b></div>

      <div class="sc" id="sc-spd"><span class="k">속도 <em>(m/s)</em></span><b id="st-spd">—</b></div>
      <div class="sc" id="sc-cur"><span class="k">전류 <em>(A)</em></span><b id="st-cur">—</b></div>
      <!-- eph — 위성 수가 많아도 이 값이 부풀면 위치가 흔들린다.
           위성 수 바로 아래에 둔다 — 개수와 오차를 세로로 같이 읽는다. -->
      <div class="sc" id="sc-eph"><span class="k">위치 오차 <em>(m)</em></span><b id="st-eph">—</b></div>

      <!-- 모터는 숫자 넷이 아니라 **기체 그림 위의 넷**이다.
           숫자만 보면 "48 과 41 중 어느 쪽이 어느 팔인가" 를 매번 머리로
           옮겨야 한다. 기수를 위로 둔 X 형상에 그대로 얹으면 눈이 바로
           짚는다 — 부하가 큰 팔이 굵고 밝다.
           원의 크기·밝기가 값이고, 숫자는 확인용으로 원 안에 같이 둔다. -->
      <div class="sc" id="sc-frame">
        <!-- 🔴 viewBox 를 칸 비율(약 400×140, 2.8:1)에 맞췄다.
             예전 140×100(1.4:1)은 칸보다 세로로 길어, meet 로 맞추면 좌우에
             빈 띠가 생기고 로터가 그만큼 작아졌다. 칸 비율에 가깝게 두면
             같은 자리에서 로터가 훨씬 커진다.
             라벨을 뺐으므로 그림이 칸 높이를 다 쓴다. -->
        <svg id="mframe" viewBox="0 0 280 100" aria-label="모터별 부하">
          <!-- 동체·기수. 기수(위)가 전방이다 — HUD 의 기수 방향과 같다. -->
          <path class="fuse" d="M140 30 L140 72" />
          <path class="nose" d="M140 10 L131 28 L149 28 Z" />
          <!-- 팔 4개. X 배치 그대로. 로터를 바깥으로 벌려 동체·기수가
               가려지지 않게 한다 — 전후 구분이 이 그림의 절반이다. -->
          <path class="arm" id="arm-LF" d="M140 51 L52 20" />
          <path class="arm" id="arm-RF" d="M140 51 L228 20" />
          <path class="arm" id="arm-LB" d="M140 51 L52 82" />
          <path class="arm" id="arm-RB" d="M140 51 L228 82" />
          <!-- 로터. r 은 스크립트가 값에 따라 키운다. -->
          <circle class="rot" id="rot-LF" cx="52" cy="20" r="18" />
          <circle class="rot" id="rot-RF" cx="228" cy="20" r="18" />
          <circle class="rot" id="rot-LB" cx="52" cy="82" r="18" />
          <circle class="rot" id="rot-RB" cx="228" cy="82" r="18" />
          <text class="mv" id="mv-LF" x="52" y="20">—</text>
          <text class="mv" id="mv-RF" x="228" y="20">—</text>
          <text class="mv" id="mv-LB" x="52" y="82">—</text>
          <text class="mv" id="mv-RB" x="228" y="82">—</text>
        </svg>
      </div>

      <!-- 편차 = 최대−최소 %p. 넷이 얼마나 벌어졌나가 이 계기의 판정이다.
           절대 부하는 무겁거나 바람이 불면 다 같이 오르지만, 편차는
           **한쪽만** 무리하고 있을 때만 오른다 — 그것이 이상 신호다. -->
      <div class="sc" id="sc-mspread"><span class="k">모터 편차 <em>(%p)</em></span><b id="st-mspread">—</b></div>
      <!-- 넷의 평균. 편차가 "치우침" 이면 이쪽은 "얼마나 힘든가" 다.
           호버 54% 근처가 이 기체의 정상이다 (MOT_THST_HOVER=0.540). -->
      <div class="sc" id="sc-mavg"><span class="k">모터 평균 <em>(%)</em></span><b id="st-mavg">—</b></div>
    </div>
  </section>

  <!-- 우: 흘러가는 차트 + FC 메시지 서랍.
       로그 뷰어(log.html)와 같은 배치·같은 chart.js 를 쓴다 — 지난 비행과
       지금 비행을 같은 그림으로 읽어야 눈이 안 흔들린다. -->
  <section id="chartPane">
    <div id="mapPane">
      <div id="lmap"></div>

        <!-- GPS 를 한 번도 못 봤으면 지도가 빈 판이 된다. 왜 비었는지 말해야 한다. -->
      <div id="mapEmpty">GPS 없음</div>
    </div>
    <div id="charts"></div>
    <!-- 하단 바. 화면 위를 한 줄도 안 쓰려고 여기 다 모았다.
         링크 상태는 글자가 아니라 점 하나다 — 초록/노랑/빨강. -->
    <div class="msgs">
      <div class="hd">
        <span id="dot" class="dot" title="링크 상태">●</span>
        <!-- 어느 단을 볼지. 차트 위에 떠 있던 것을 여기로 내렸다 —
             그림 위를 가리지 않고, 조작이 한 줄에 모인다. -->
        <div id="toc"></div>
        <span class="grow"></span>
        <span class="stats" id="stats"></span>
        <select id="win">
          <option value="60">1분</option>
          <option value="180" selected>3분</option>
          <option value="600">10분</option>
          <option value="0">전체</option>
        </select>
        <button id="pbOpen">재생</button>
      </div>
    </div>
  </section>
</main>

<!-- ── 로그 재생 ──────────────────────────────────────────────────
     재생 바는 화면 맨 아래에 깔린다. 켜져 있는 동안에만 보인다 —
     실시간으로 보고 있을 때 조작거리가 늘어나면 안 된다. -->
<div id="pbBar" hidden>
  <button id="pbPlay" title="재생/일시정지 (space)">▶</button>
  <span id="pbName" title="열려 있는 로그"></span>
  <input id="pbSeek" type="range" min="0" max="1000" value="0" step="1"
         title="위치">
  <span id="pbTime" class="mono">0:00 / 0:00</span>
  <select id="pbRate" title="재생 속도">
    <option value="0.5">0.5×</option>
    <option value="1" selected>1×</option>
    <option value="2">2×</option>
    <option value="4">4×</option>
    <option value="10">10×</option>
  </select>
  <button id="pbExit">실시간</button>
</div>

<!-- 로그 고르기. 목록은 /api/logs 가 최신순으로 준다. -->
<div id="pbPick" hidden>
  <div class="box">
    <div class="hd">
      <b>비행 로그 재생</b>
      <span class="grow"></span>
      <button id="pbPickClose">닫기</button>
    </div>
    <div id="pbList">불러오는 중…</div>
  </div>
</div>

<script src="/chart.js"></script>
<script src="/vendor/leaflet/leaflet.js"></script>
<script src="/live.js"></script>
